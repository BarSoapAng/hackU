[project]
name = "imessage-agent-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "websockets==15.0.1",
  "cryptography==50.0.2",
  "openai==2.15.0",
  "haystack-ai==3.4.1",
  "tiktoken==0.14.0",
  "python-multipart==0.0.33",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
