<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sprout notes · Hypha</title>
  <link href="https://db.onlinewebfonts.com/c/4a373e70cd01dec089c1dd1185ceba51?family=Maison+Neue+Bold" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style nonce="__NONCE__">
    :root{font-family:"DM Sans",sans-serif;color:#3b291f;background:#faf8f5;color-scheme:light;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;padding:0 28px}
    .site-header{display:flex;align-items:center;gap:10px;width:100%;max-width:1120px;margin:0 auto;padding:28px 0;border-bottom:1px solid #e5dfd9}
    .brand,h1,h2{font-family:"Maison Neue Bold",sans-serif;font-weight:700;letter-spacing:-.04em}.brand{font-size:25px;line-height:1}
    main{width:100%;max-width:1120px;margin:0 auto;padding:48px 0;flex:1}h1{font-size:clamp(36px,6vw,48px);line-height:1.08;margin:16px 0}h2{font-size:22px;margin:0 0 20px}
    p{line-height:1.65;margin:8px 0}.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#746b64;margin:0}.muted{color:#746b64;font-size:14px}
    .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;margin-top:28px}aside{min-width:0;padding-right:24px;border-right:1px solid #e5dfd9}section{min-width:0;padding:24px;background:#fff;border:1px solid #e5dfd9;border-radius:12px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:1px solid #d6cec6;border-radius:8px;background:transparent;color:#3b291f;padding:10px 14px;min-height:44px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
    button:hover{background:#f0ebe5}button:disabled{opacity:.5;cursor:default}.primary{background:#3b291f;color:#fff;border-color:#3b291f}.primary:hover{background:#514035}.danger{margin-left:auto}
    label{display:block;font-size:14px;font-weight:500;margin-bottom:10px}input[type=text],textarea{width:100%;border:1px solid #d6cec6;border-radius:8px;background:#fff;color:inherit;padding:14px 16px;font:inherit;font-size:16px}
    input::placeholder,textarea::placeholder{color:#847a72}textarea{min-height:45vh;resize:vertical;line-height:1.65;margin-bottom:16px}
    input[type=text]{margin-bottom:24px}ul{list-style:none;padding:0;margin:0}li{margin:8px 0}li button{width:100%;text-align:left;overflow-wrap:anywhere;border-color:transparent;padding:12px}
    li button[aria-current=true]{border-color:#d6cec6;background:#f0ebe5}.filename{display:block}.state{display:block;margin-top:4px;font-size:12px;color:#746b64}
    #message{min-height:24px;margin:20px 0 0;font-size:14px;color:#746b64;overflow-wrap:anywhere}#message[data-error=true]{color:#8b2828}#empty{padding:64px 16px;text-align:center;color:#746b64}#file-status{overflow-wrap:anywhere}
    .hidden{display:none!important}:focus-visible{outline:2px solid #3b291f;outline-offset:4px}
    footer{width:100%;max-width:1120px;margin:0 auto;padding:22px 0;border-top:1px solid #e5dfd9;color:#746b64;font-size:12px;text-align:center}
    @media(max-width:680px){body{padding:0 24px}.site-header{padding:24px 0}main{padding:36px 0}.layout{grid-template-columns:1fr;gap:24px}aside{padding:0 0 20px;border-right:0;border-bottom:1px solid #e5dfd9}section{padding:20px}#files{display:flex;gap:8px;overflow-x:auto;padding:4px}li{flex:0 0 180px;margin:0}textarea{min-height:40vh}}
  </style>
</head>
<body>
<header class="site-header">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8M12 17C6 17 3 14 3 8c6 0 9 3 9 9ZM12 13c0-6 3-10 9-10 0 6-3 10-9 10ZM8 21h8"/></svg>
  <span class="brand">Hypha</span>
</header>
<main>
  <header><p class="eyebrow">A little room to grow</p><h1>Sprout notes</h1><p class="muted">Keep your knowledge together. Add and organize the notes your Sprout learns from.</p></header>
  <p id="message" role="status" aria-live="polite">Opening your Sprout…</p>
  <div id="workspace" class="layout hidden">
    <aside aria-label="Notes">
      <h2>Your notes</h2>
      <div class="toolbar"><button id="create" class="primary">New note</button><button id="import">Import note</button><button id="refresh">Refresh</button><input id="upload" type="file" accept=".md,text/markdown" class="hidden"></div>
      <p id="file-count" class="muted"></p><ul id="files"></ul>
    </aside>
    <section aria-label="Note editor">
      <p id="empty">Choose a note, create one, or import a Markdown note to begin.</p>
      <div id="editor" class="hidden">
        <label for="name">Note name</label><input id="name" type="text" maxlength="120" autocomplete="off" spellcheck="false" placeholder="notes.md">
        <label for="content">Markdown</label><textarea id="content" spellcheck="false" placeholder="# Your source material"></textarea>
        <div class="toolbar"><button id="save" class="primary">Save</button><button id="delete" class="danger">Delete note</button></div>
        <p id="file-status" class="muted"></p>
      </div>
    </section>
  </div>
  <noscript><p class="muted">Enable JavaScript to open and edit your Sprout’s notes.</p></noscript>
</main>
<footer>Your knowledge, ready to sprout.</footer>
<script nonce="__NONCE__">
(() => {
  let token = location.hash.slice(1);
  history.replaceState(null, '', location.pathname);
  let selected = null, files = [], dirty = false, busy = false;
  const byId = id => document.getElementById(id);
  function notice(text, error = false) { byId('message').textContent = text; byId('message').dataset.error = error; }
  function setBusy(value) { busy = value; document.querySelectorAll('button').forEach(button => button.disabled = value); }
  async function api(path, options = {}) {
    const response = await fetch('/api/notes' + path, {
      ...options, cache: 'no-store', credentials: 'omit', redirect: 'error',
      headers: {'Authorization': 'Bearer ' + token, 'Accept': 'application/json', 'ngrok-skip-browser-warning': '1', ...(options.headers || {})}
    });
    if (response.status === 401) {
      token = ''; byId('workspace').classList.add('hidden');
      throw new Error('This link expired. Send /notes in iMessage for a new editing link.');
    }
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(typeof body.detail === 'string' ? body.detail : 'The request could not be completed.');
    }
    if (response.status === 204) return null;
    return response.json().catch(() => { throw new Error('The server returned an unexpected response. Please try again shortly.'); });
  }
  function json(method, body) { return {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}; }
  function canLeave() { return !dirty || confirm('Discard your unsaved changes?'); }
  function renderList() {
    byId('files').replaceChildren();
    byId('file-count').textContent = files.length + (files.length === 1 ? ' note' : ' notes');
    for (const file of files) {
      const item = document.createElement('li'), button = document.createElement('button');
      button.setAttribute('aria-current', selected?.id === file.id ? 'true' : 'false');
      const name = document.createElement('span'), state = document.createElement('span');
      name.className = 'filename'; name.textContent = file.name;
      state.className = 'state'; state.textContent = file.status === 'failed' ? 'Indexing failed — save again to retry' : file.status;
      button.append(name, state); button.addEventListener('click', () => action(async () => {
        if (canLeave()) open(await api('/' + encodeURIComponent(file.id)));
      })); item.append(button); byId('files').append(item);
    }
  }
  function open(file) {
    selected = file; dirty = false;
    byId('name').value = file.name; byId('content').value = file.content;
    byId('editor').classList.remove('hidden'); byId('empty').classList.add('hidden');
    byId('delete').classList.toggle('hidden', !file.id);
    byId('file-status').textContent = file.id ? 'Version ' + file.version + ' · ' + file.status : 'New note — save to add it to your Sprout.';
    renderList();
  }
  async function refresh() { files = (await api('')).notes; renderList(); }
  async function action(fn) {
    if (busy) return;
    setBusy(true);
    try { await fn(); } catch (error) { notice(error.message || 'Something went wrong. Try again.', true); }
    finally { setBusy(false); }
  }
  byId('create').onclick = () => { if (canLeave()) open({name: '', content: '', status: 'new'}); };
  byId('refresh').onclick = () => action(async () => { await refresh(); notice('Note status refreshed. Your unsaved text is preserved.'); });
  byId('name').oninput = byId('content').oninput = () => { dirty = true; };
  byId('save').onclick = () => action(async () => {
    const body = {name: byId('name').value, content: byId('content').value};
    if (selected.id) body.expected_version = selected.version;
    const file = await api(selected.id ? '/' + encodeURIComponent(selected.id) : '', json(selected.id ? 'PUT' : 'POST', body));
    open(file); await refresh(); notice('Saved. Indexing is pending.');
  });
  byId('delete').onclick = () => action(async () => {
    if (!selected.id || !confirm('Delete ' + selected.name + '?')) return;
    await api('/' + encodeURIComponent(selected.id), json('DELETE', {expected_version: selected.version}));
    selected = null; dirty = false; byId('editor').classList.add('hidden'); byId('empty').classList.remove('hidden');
    await refresh(); notice('Note deleted.');
  });
  byId('import').onclick = () => { if (canLeave()) byId('upload').click(); };
  byId('upload').onchange = () => action(async () => {
    const file = byId('upload').files[0]; byId('upload').value = '';
    if (!file) return;
    const existing = files.find(item => item.name.toLowerCase() === file.name.toLowerCase());
    let result;
    if (existing) {
      if (!confirm('Replace ' + existing.name + ' with this import?')) return;
      const content = new TextDecoder('utf-8', {fatal: true}).decode(await file.arrayBuffer());
      result = await api('/' + encodeURIComponent(existing.id), json('PUT', {name: file.name, content, expected_version: existing.version}));
    } else {
      result = await api('/upload?name=' + encodeURIComponent(file.name), {method: 'POST', headers: {'Content-Type': 'text/markdown'}, body: file});
    }
    open(result); await refresh(); notice('Imported. Indexing is pending.');
  });
  window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  if (!token) { notice('Open the full editing link from iMessage. Send /notes for a new link.', true); return; }
  action(async () => { await refresh(); byId('workspace').classList.remove('hidden'); notice('Your editing link lasts one hour. Save changes before leaving.'); });
})();
</script>
</body>
</html>
