services:
  nemotron:
    image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    shm_size: 16gb
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VLLM_API_KEY: ${NEMOTRON_API_KEY:?Run bash prepare.sh first}
      VLLM_USE_V2_MODEL_RUNNER: "1"
    volumes:
      - ./cache/huggingface:/root/.cache/huggingface
      - ./cache/vllm:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command:
      - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
      - --revision
      - bee7596271d1495f6992ae224aefde4410e816b8
      - --served-model-name
      - nemotron-builder
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "4096"
      - --gpu-memory-utilization
      - "0.85"
      - --quantization
      - modelopt_fp4
      - --moe-backend
      - marlin
      - --kv-cache-dtype
      - fp8
      - --async-scheduling
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --mamba-backend
      - flashinfer
      - --mamba-cache-mode
      - align
      - --reasoning-parser
      - nemotron_v3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
