events {}
http {
    access_log off;
    error_log /dev/stderr warn;
    server {
        listen 127.0.0.1:8011;
        absolute_redirect off;
        client_max_body_size 10m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 180s;
        location = /dashboard { return 307 /dashboard/; }
        location /dashboard/ { proxy_pass http://127.0.0.1:8010; }
        location /api/internal/ { proxy_pass http://127.0.0.1:8010; }
        location / { proxy_pass http://127.0.0.1:8001; }
    }
}
