name: hypha-dashboard
services:
  dashboard:
    build:
      context: ../..
      dockerfile: deploy/brev/dashboard.Dockerfile
    env_file: ../../.env
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  gateway:
    image: nginx:stable-alpine
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./dashboard.nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
